<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body { display: flex; align-items: center; justify-content: center; }
      img, video, canvas { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
      /* 동영상은 빈 여백을 검게 칠하므로 widget.js가 영상 비율에 맞춘 크기를 직접 정한다. */
      video { flex: none; background: transparent; }
      img { transition: opacity 0.45s ease; }
      img.fade { opacity: 0; }
      #clock {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; height: 100%; color: #fff; user-select: none;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', 'Malgun Gothic', sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      #face { display: flex; align-items: baseline; line-height: 1; font-variant-numeric: tabular-nums; }
      #time { font-size: min(24vw, 58vh); font-weight: 300; letter-spacing: -0.02em; }
      #sec { font-size: min(8vw, 19vh); font-weight: 600; color: #f5a524; margin-left: 0.25em; }
      #date { font-size: min(5.2vw, 13vh); font-weight: 500; margin-top: 0.5em; opacity: 0.88; letter-spacing: 0.04em; }
      #memo {
        width: 100%; height: 100%; box-sizing: border-box; padding: 16px 18px; border: none; outline: none; resize: none;
        background: rgba(20, 22, 26, 0.88); color: #eef0f3; caret-color: #f5a524;
        font: 15px/1.65 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', sans-serif;
      }
      /* 패널 위젯(src/widgets/kinds/*)의 공통 바탕. 크기는 cqw/cqh/cqmin 단위로 창 크기에 맞춘다. */
      #panel {
        --accent: #f5a524; --on-accent: #1a1300; --text: #eef0f3; --muted: #a9b0bc;
        --raised: #262a33; --line: #343945; --danger: #ff8a80;
        width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; container-type: size;
        background: rgba(20, 22, 26, 0.88); color: var(--text); user-select: none;
        font: 14px/1.4 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', sans-serif;
      }
      #panel *, #panel *::before, #panel *::after { box-sizing: border-box; }
      /* :where로 우선순위를 낮춰, 각 위젯의 .k-<종류> 규칙이 글자 크기와 색을 바꿀 수 있게 한다. */
      :where(#panel) :where(button, input) { font: inherit; color: inherit; }
      #memo::placeholder { color: #a9b0bc; }
      #memo::selection { background: #f5a524; color: #1a1300; }
      #memo::-webkit-scrollbar { width: 8px; }
      #memo::-webkit-scrollbar-thumb { background: #343945; border-radius: 4px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <img id="img" alt="" draggable="false" hidden />
    <video id="video" muted loop autoplay playsinline disablepictureinpicture hidden></video>
    <!-- 재생을 멈춘 동안 움직이는 사진 대신 보여주는 정지 장면 -->
    <canvas id="still" hidden></canvas>
    <div id="clock" hidden><div id="face"><span id="time"></span><span id="sec"></span></div><div id="date"></div></div>
    <div id="panel" hidden></div>
    <textarea id="memo" placeholder="여기에 메모를 적으세요" spellcheck="false" hidden></textarea>
    <script type="module" src="/src/widget.js"></script>
  </body>
</html>
